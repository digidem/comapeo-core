# Runs test-e2e/server.js against real comapeo-cloud servers deployed to Fly.
# The in-process server misses bugs this catches, but each run deploys several
# Fly apps, so it runs on main, nightly, on demand, and on PRs labelled
# `server-test`.

name: Server e2e cloud test

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

jobs:
  # Job id is `build` because main's branch protection requires a check of that
  # name; a job skipped by `if` counts as passing.
  build:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'server-test')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # fly-cleanup.yml parses the run id out of these names
      FLY_APP_PREFIX: comapeo-cloud-test-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}-
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20.x
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: npm ci
      - run: npm run build --if-present
      - name: Run server tests
        # A step timeout, unlike the job timeout, still lets the steps below run
        timeout-minutes: 25
        env:
          REMOTE_TEST_SERVER: true
          DEBUG: mapeo:*
          SERVER_TEST_LOG_DIR: ${{ runner.temp }}/server-test-logs
        run: |
          set -o pipefail
          mkdir -p "$SERVER_TEST_LOG_DIR"
          # Full debug output goes to the log artifact; the job log keeps the rest
          node --test ./test-e2e/server.js 2>&1 \
            | tee "$SERVER_TEST_LOG_DIR/client.log" \
            | grep --line-buffered -vE '^\s*# \S+ mapeo:'
      - name: Upload logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: server-test-logs-${{ github.run_attempt }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/server-test-logs
          if-no-files-found: ignore
      - name: Destroy this job's Fly apps
        if: always()
        run: |
          flyctl apps list --org digidem --json \
            | jq -r --arg p "$FLY_APP_PREFIX" '.[].Name | select(startswith($p))' \
            | while read -r app; do flyctl apps destroy "$app" -y || true; done

  report:
    needs: build
    if: always() && github.event_name != 'pull_request' && (needs.build.result == 'failure' || needs.build.result == 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Open or update the tracking issue
        run: |
          label=server-test-failure
          gh label create "$label" --color B60205 \
            --description 'Server e2e cloud test failed on main or nightly' 2>/dev/null || true
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          line="- ${{ needs.build.result }} on \`$GITHUB_REF_NAME\` (${GITHUB_EVENT_NAME}, ${GITHUB_SHA::7}): $run_url"
          issue=$(gh issue list --label "$label" --state open --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$line"
          else
            gh issue create --label "$label" \
              --title 'test: server e2e cloud test is failing' \
              --body "The Fly server e2e test failed. Each further failure adds a comment here; close this once it's fixed and the next failure opens a new issue.

          $line"
          fi
