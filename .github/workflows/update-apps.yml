name: Update CoMapeo Apps

# comapeo-mobile picks up core via @comapeo/core-react-native, so only desktop
# consumes core directly. Receiver: bump-first-party-deps.yml in comapeo-desktop.
on:
  release:
    types: [published]

jobs:
  update-desktop:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App Token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          # Without these the token is scoped to this repo and the dispatch 403s.
          owner: digidem
          repositories: comapeo-desktop
      - name: Trigger comapeo-desktop first-party bump
        run: |
          gh api repos/digidem/comapeo-desktop/dispatches \
            -f event_type=first-party-release \
            -f 'client_payload[package]=@comapeo/core'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
