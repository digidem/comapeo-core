# Destroys Fly test apps left behind by server-test.yml runs that were killed
# before their own cleanup step ran.
# See <https://github.com/digidem/comapeo-core/issues/914>.

name: Fly Cleanup
on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *' # Every day at 5am UTC

permissions:
  actions: read

jobs:
  cleanup:
    name: Cleanup Orphaned Apps
    runs-on: ubuntu-latest
    concurrency: deploy-group
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          active_runs=$(gh run list --workflow server-test.yml --json status \
            --jq '[.[] | select(.status != "completed")] | length')
          apps=$(flyctl apps list --org digidem --json \
            | jq -r '.[].Name | select(startswith("comapeo-cloud-test-"))')
          for app in $apps; do
            run_id=$(sed -nE 's/^comapeo-cloud-test-([0-9]+)-.*/\1/p' <<<"$app")
            if [ -n "$run_id" ]; then
              status=$(gh api "repos/$GH_REPO/actions/runs/$run_id" --jq .status 2>/dev/null || echo unknown)
              if [ "$status" != completed ]; then
                echo "Keeping $app (run $run_id is $status)"
                continue
              fi
            elif [ "$active_runs" -gt 0 ]; then
              # Names without a run id (older or local runs) can't be matched to a run
              echo "Keeping $app (no run id, $active_runs server-test runs active)"
              continue
            fi
            echo "Destroying $app"
            flyctl apps destroy "$app" -y
          done
          echo "Done"
